# Automation "Tessera – page rotation"
# Settings → Automations & scenes → Create automation → ⋮ → Edit in YAML
#
# - Timer finished: the next page of sensor.tessera_page_list.
# - A page joins the list (the printer starts): that page at once.
# - The current page leaves the list: the first page.
# - Only one page: nothing is sent to the screen.
# - "Back to page 1" is off while the rotation runs; the rotation rests while you sleep.
alias: Tessera – page rotation
description: Rotates the Tessera screen through the pages of sensor.tessera_page_list.
mode: queued
max: 5
triggers:
  - trigger: timer.finished
    target:
      entity_id: timer.tessera_rotation
    id: next
  - trigger: state
    entity_id: sensor.tessera_page_list
    to: ~
    id: list
  - trigger: state
    entity_id:
      - input_boolean.tessera_rotation
      - binary_sensor.YOUR_SLEEP
      - input_number.tessera_rotation_interval
    to: ~
    id: restart
  - trigger: homeassistant
    event: start
    id: restart
actions:
  - variables:
      current: "{{ states('input_number.tessera_current_page') | int(1) }}"
      target_page: >-
        {%- set listed = states('sensor.tessera_page_list').split(',') | map('int', 0) | select('>', 0) | list -%}
        {%- set pages = listed if listed else [1] -%}
        {%- set before = (trigger.from_state.state.split(',') | map('int', 0) | select('>', 0) | list)
              if trigger.id == 'list' and trigger.from_state else [] -%}
        {%- set added = pages | reject('in', before) | list -%}
        {%- if trigger.id == 'list' and before and added -%}{{ added | last }}
        {%- elif trigger.id == 'next' and current in pages -%}{{ pages[(pages.index(current) + 1) % (pages | length)] }}
        {%- elif current in pages -%}{{ current }}
        {%- else -%}{{ pages | first }}{%- endif -%}
  - choose:
      - conditions:
          - condition: state
            entity_id: input_boolean.tessera_rotation
            state: "off"
        sequence:
          - action: timer.cancel
            target:
              entity_id: timer.tessera_rotation
          - action: switch.turn_on
            target:
              entity_id: switch.YOUR_SCREEN_back_to_page_1
            continue_on_error: true
          - stop: Rotation is off
      - conditions:
          - condition: state
            entity_id: binary_sensor.YOUR_SLEEP
            state: "on"
        sequence:
          - action: timer.cancel
            target:
              entity_id: timer.tessera_rotation
          - stop: Sleeping
  - if:
      - condition: state
        entity_id: switch.YOUR_SCREEN_back_to_page_1
        state: "on"
    then:
      - action: switch.turn_off
        target:
          entity_id: switch.YOUR_SCREEN_back_to_page_1
        continue_on_error: true
  - if:
      - condition: template
        value_template: "{{ target_page != current or trigger.id != 'next' }}"
    then:
      # continue_on_error: a screen that is briefly offline does not stop the rotation.
      - action: esphome.YOUR_NODE_show_page
        data:
          page: "{{ target_page }}"
        continue_on_error: true
      - action: input_number.set_value
        target:
          entity_id: input_number.tessera_current_page
        data:
          value: "{{ target_page }}"
  - action: timer.start
    target:
      entity_id: timer.tessera_rotation
    data:
      duration: "{{ states('input_number.tessera_rotation_interval') | int(30) }}"
